scenario_name: cba_2020_liquidity_outflow

time:
  horizon_months: 6
  frequency: monthly

stress:
  mode: full_systemic

currency:
  currency_mode: combined
  run_currency_sheets: true

severity:
  # CBA-style 6-month liquidity stress:
  # severe outflows in months 1-2, modest continuation in months 3-6.
  alpha_path: [1.00, 1.00, 0.25, 0.25, 0.25, 0.25]

  # Currency-specific version of the same timing logic.
  # FX is kept slightly more severe/persistent than AMD.
  alpha_path_amd: [0.90, 0.90, 0.20, 0.20, 0.20, 0.20]
  alpha_path_fx:  [1.00, 1.00, 0.30, 0.30, 0.30, 0.30]

modules:
  first_round: true
  bank_reaction: true
  policy_intervention: true
  fire_sales: true
  interbank_contagion: true

thresholds:
  lcr_minimum: 1.20
  reaction_lcr_trigger: 1.20
  reaction_target_mode: trigger
  reaction_target_cap: 1.20

policy_intervention:
  enabled: true
  support_mode: collateral_capped

  # LoLR principle: solvent but illiquid banks only.
  support_only_solvent_illiquid: true
  solvency_equity_threshold: 0.0

  # Support actual unpaid cash outflows.
  illiquidity_cash_shortfall_enabled: true

  # Also allow support for LCR-buffer repair.
  illiquidity_lcr_threshold: 1.20
  support_lcr_gap: true
  lcr_support_target: 1.20

  # HQLA/assets is diagnostic only in the benchmark.
  illiquidity_hqla_assets_threshold: null
  support_hqla_assets_gap: false
  hqla_assets_support_target: 0.10

  eligible_collateral:
    - government_securities
    - bank_securities
    - corporate_securities

  collateral_haircuts:
    government_securities: 0.05
    bank_securities: 0.15
    corporate_securities: 0.25

fire_sales:
  enabled: true

  # Conservative public implementation: price-mediated contagion
  # only through government securities.
  asset_columns:
    - government_securities

  reference_sale_fraction: 0.05
  price_impact_at_reference_sale_fraction:
    government_securities: 0.02

  minimum_market_price: 0.01

  market_depth_multiplier_by_asset:
    government_securities: 1.0

  # Off in the benchmark. Used only in asset-purchase counterfactuals.
  central_bank_asset_purchases:
    enabled: false
    purchase_share_of_bank_sales:
      government_securities: 0.50

interbank_contagion:
  enabled: true
  loss_given_default: 0.60
  max_contagion_rounds: 5
  network_exposure_scale: 1.00
  liquidity_resolution_floor: 1.00
  collateral_exhaustion_tol: 1.0e-6
